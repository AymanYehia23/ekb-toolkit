name: CI

on:
  push:
    branches: [flutter-engineers, main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt
          gem install minitest --version '~> 5.0' --no-document

      - name: Verify the toolkit and fictional application bundles
        run: scripts/verify
