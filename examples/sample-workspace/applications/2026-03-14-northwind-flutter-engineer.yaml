job_description: |
  Flutter Engineer — Northwind Retail (Remote, EU)

  We are building the next version of our customer shopping app, used by
  shoppers across six markets. You will work on the app itself: the browsing
  and checkout journey, the offline behavior our field team keeps asking for,
  and the release process that gets it in front of people.

  What you will do
  - Build and maintain customer-facing features in Flutter.
  - Improve app performance, particularly on lower-end Android devices.
  - Make the app usable with poor or no connectivity.
  - Integrate third-party services including payment providers.
  - Support localization across our six markets, including Arabic.
  - Own releases to the App Store and Google Play.
  - Take part in code reviews and help keep our test coverage meaningful.
  - Work with product to shape requirements before implementation starts.

  What we are looking for
  - Strong Flutter and Dart.
  - Experience with state management at application scale.
  - Comfortable with native Android and iOS build configuration.
  - Testing habits that go beyond "it compiles".
  - 3+ years building mobile applications.

  Nice to have
  - Retail or e-commerce experience.
  - CI/CD ownership.
  - Experience with a design system across multiple apps.

