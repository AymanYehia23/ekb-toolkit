records:
  - id: mealmate-001
    statement: >
      Worked on the checkout flow's payment integration, adding a server
      confirmation step so a completed charge is only recognized after the
      backend has verified it with the provider.
    kind: repo-verified
    involvement: contributed
    evidence:
      - range: 4d5e6f7..8a9b0c1
        note: The confirmation call, the pending state, and its recovery path.
      - path: lib/checkout/payment_controller.dart
        at: 8a9b0c1
    reasoning: >
      The user's identity appears on the confirmation and recovery commits.
      Other identities appear on the provider SDK integration in the same range,
      so involvement is recorded as contributed rather than implemented.
    limitations: >
      Shared feature. Feature-level wording is supported; the provider SDK
      integration itself was another engineer's work and must not be implied.
    interview_notes: >
      Confirmed 2026-02-13: the recovery path exists because a network drop
      between charge and confirmation used to leave the order in a state the app
      could not resolve without support intervention.
    tags: [payments, networking, architecture]

